# spec_source: modelcontextprotocol/experimental-ext-triggers-events@main docs/design-sketch-proposal.md
# extracted: 2026-09-15
#
# ############################################################################
# # 9999 IS A PLACEHOLDER. MCP Events has no SEP number yet.                 #
# # Renaming it is a release blocker before this file is upstreamed.         #
# ############################################################################
#
#   SEP numbers are PR numbers in modelcontextprotocol/modelcontextprotocol,
#   and no events PR has been opened there — the work lives in the separate
#   experimental-ext-triggers-events repository. Both ends enforce a number:
#   src/traceability/index.ts:174 filters the directory on `/^sep-\d+\.yaml$/`
#   and line 41 filters emitted check IDs on `/^sep-\d+-/`, so a file named
#   `events.yaml` is silently dropped from the manifest rather than rejected;
#   src/new-sep/index.ts:163 rejects any argument that is not a positive
#   integer from the other side. There is no honest name that works.
#
#   9999 is far from the live range (~2663), so a collision is implausible.
#   The rename is mechanical and wide: this filename, the `sep:` field below,
#   every `sep-9999-` id here, and the same ids in
#   src/scenarios/server/events/.
#
#   This must not merge under the placeholder. plan.modelcontextprotocol.io
#   reads the manifest built from `main`, so a draft PR is invisible to it, but
#   a merge would publish SEP 9999 as though it were real and a later rename
#   would then have to retract it. The rename is therefore a merge blocker, not
#   a follow-up.
#
#   The reservation question is open with the WG in #triggers-events-wg. Peter
#   is the person to ask and is away the week of 2026-09-14 for AGNTCon, so the
#   answer is not expected before the scenarios land.
#
# provenance: extracted against the merged design sketch on `main`, which
#   landed 2026-09-08. Before that merge the document was a moving PR head and
#   not worth scoring against. Two spec commits land inside this extraction:
#   `197c32b4` (2026-05-10) renamed the duration fields to `nextPollMs` and
#   `maxAgeMs`, and `28ec35e9` (2026-09-04) added event-type removal and
#   breaking-change termination.
#
#   The sketch is a design document rather than a spec diff, so there is no
#   `docs/specification/draft/*.mdx` to point `new-sep` at — `specPathToUrl`
#   (src/new-sep/index.ts:19) hard-requires that prefix, so `--spec-path` does
#   not help either. The file was scaffolded with `--spec-url`, which
#   short-circuits the GitHub lookup. There are no section anchors to cite, so
#   `spec_url` names the document itself and rows carry no per-row `url`.
#   Expect one more pass once the text becomes a spec PR and gains anchors.
#
# coverage: 131 declared checks plus 30 excluded rows.
#
#   A keyword sweep of the source finds 144 RFC 2119 keyword occurrences across
#   119 sentences: 34 MUST, 9 MUST NOT, 3 REQUIRED, 56 SHOULD, 7 SHOULD NOT
#   (109 normative), plus 34 MAY and 1 OPTIONAL. Counting MUST NOT inside MUST
#   and SHOULD NOT inside SHOULD, as the handoff table does, the same sweep
#   reads as 43 / 3 / 63; the two counts agree.
#
#   Only 46 of the declared rows quote a sentence carrying a keyword. The other
#   85 are shape requirements the document states declaratively — the
#   `EventOccurrence` field table, the error-code table, the `events/list`
#   descriptor fields, the response payloads. They are normative and directly
#   testable, they are simply not written with a keyword, which is why the row
#   count exceeds the sentence count in the sweep. One keyword sentence also
#   frequently carries several distinct obligations (the Standard Webhooks
#   signature sentence, the subscription-key sentence), which pushes the same
#   way.
#
#   severity rule, since the usual "follow the keyword" mapping is undefined
#   for a shape row: MUST / MUST NOT / REQUIRED -> FAILURE (30 rows), SHOULD /
#   SHOULD NOT -> WARNING (16 rows). For a shape row, a field the document
#   marks Required in a schema table, or a wire fact a client cannot work
#   without (an error code, a method existing at all), is FAILURE; everything
#   else drawn from an example payload is WARNING.
#
#   Pure MAY and OPTIONAL sentences get no row at all, per the handoff
#   disposition table. The five that initially got one are demoted to
#   `excluded:` at the foot of this file rather than deleted, so the sweep
#   stays auditable against the document.
#
# excluded rather than declared: client-SDK and host obligations (poll floor,
#   payload sanitization, policy evaluation), receiver obligations the harness
#   implements rather than grades, server-SDK implementation guidance from the
#   two "SDK Guidance" sections, and the WAF/deployment profile advisories.
#   None is a server wire obligation, so declaring them would inflate the
#   denominator with rows no server-side scenario could ever emit.
#
# deliberately not declared here: pagination semantics for `events/list`. The
#   sketch defers them ("same semantics as tools/list etc."), so the obligation
#   is the base protocol's and belongs to the core pagination scenarios.
#   `sep-9999-list-pagination` declares only the part this document adds, which
#   is that `events/list` participates in that scheme at all.
#
#   An `events/poll` against an unknown name is stated twice, once under Error
#   Codes and once as the poll consequence of an event type having been
#   removed. Only `sep-9999-removal-poll-not-found` is declared for it; a
#   second row would double-count one probe.
#
#   `## Key Design Decisions`, `## Open Questions` and `## What Is NOT in v1`
#   are rationale rather than requirements and produce no rows. The design
#   table restates the webhook secret, TTL and TLS rules already declared above
#   it.
#
# backing_scenarios: server ClientScenarios under src/scenarios/server/events/
#   emit the check IDs below (a row is "tested" once a scenario emits its ID;
#   see src/traceability/). Phase 1 ships two of the five and emits 45 of the
#   131 rows. The remaining 86 report as untested until the later scenarios
#   land, which is the manifest working as intended rather than a gap here:
#     discovery.ts (events-discovery), 12 rows — the two capability rows, the
#       two sep-9999-list-* rows, the six sep-9999-descriptor-* rows, and
#       sep-9999-error-not-found plus sep-9999-error-server-range, both graded
#       off one unknown-name probe.
#     poll.ts (events-poll), 33 rows — the sep-9999-poll-* rows, the
#       sep-9999-occurrence-* rows, the sep-9999-cursor-* /
#       sep-9999-max-age-* / sep-9999-truncated-* rows reachable through poll,
#       and sep-9999-removal-poll-not-found, which is the poll leg of the
#       removal rules.
#
#   The other four sep-9999-removal-* rows and the remaining sep-9999-error-*
#   codes need a server that can be made to remove an event type mid-run, or a
#   delivery mode this phase does not drive, so they wait on the push and
#   webhook scenarios.
#   Still to come, and reported untested in the manifest until they land:
#     push.ts (events-push) — the sep-9999-stream-* rows.
#     webhook.ts (events-webhook) — the sep-9999-subscribe-*, sep-9999-ttl-*
#       and sep-9999-unsubscribe-* rows.
#     webhook-delivery.ts (events-webhook-delivery) — the sep-9999-delivery-*,
#       sep-9999-verification-*, sep-9999-ssrf-* and sep-9999-envelope-* rows.
#       These need a callback URL the server under test can reach over https,
#       which localhost cannot satisfy: the SSRF rules declared below require a
#       conformant server to refuse it.
#
# measured against mcpkit, 2026-09-15, examples/events/kitchen-sink at main:
#   events-discovery 8/11, events-poll 18/28. Six divergences, each a real gap
#   rather than something the suite should accommodate. Do not soften these
#   rows to make mcpkit pass; catching them is the point.
#
#   sep-9999-capability-events-object — the server answers `events/list` but
#     declares no `capabilities.events`, so a client that reads capabilities
#     before calling never finds the surface. Not previously tracked. This is
#     also why the scenario asks before it skips: a plain "undeclared optional
#     capability" SKIP reports this server as a clean run.
#   sep-9999-poll-next-poll-ms — `nextPollSeconds` persists (events.go:504)
#     after `197c32b4` renamed it, and `maxAge` is still in seconds
#     (events.go:544). mcpkit's own wire_shape_test.go:44 asserts the
#     pre-rename name. Gap G31.
#   sep-9999-descriptor-delivery-subset — `events.topology` advertises an
#     empty `delivery`, where the document requires a non-empty subset of
#     poll/push/webhook. That source is the substitute for the missing
#     `notifications/events/list_changed`. Gap G34.
#   sep-9999-descriptor-input-schema — no descriptor carries `inputSchema`,
#     which also makes `sep-9999-poll-invalid-arguments` untestable, since
#     there is no declared constraint left to violate. Not previously tracked.
#   sep-9999-poll-events-array — `events` is omitted rather than returned as
#     an empty array when nothing happened. Not previously tracked.
#   sep-9999-poll-mode-unsupported — `events/poll` answers for an event type
#     whose `delivery` does not list `poll`, where the document requires
#     `-32014 Unsupported`. Not previously tracked.
#
#   The removal and termination rules (gap G30) are declared here but not yet
#   exercised: `RemoveSource` (registry.go:182) fires topology only and
#   `UnsupportedData` (errors.go:90) has no `reason` field, but driving that
#   path needs a server that can drop an event type mid-run, which waits on
#   the push scenario.
sep: 9999
spec_url: https://github.com/modelcontextprotocol/experimental-ext-triggers-events/blob/main/docs/design-sketch-proposal.md
requirements:
  # === Capability Declaration ===
  - check: sep-9999-capability-events-object
    text: 'Servers advertise event support in their capabilities: `{"capabilities": {"events": {"listChanged": true}}}`.'
  - check: sep-9999-capability-list-changed-flag
    text: 'The `listChanged` flag under `capabilities.events` advertises that the server sends `notifications/events/list_changed`.'

  # === Listing Available Events ===
  - check: sep-9999-list-implemented
    text: '`events/list` returns `{events: [...], nextCursor}`, where each entry describes one event type.'
  - check: sep-9999-list-pagination
    text: '`nextCursor` is "present when more pages are available; same semantics as tools/list etc."'
  - check: sep-9999-descriptor-name
    text: 'Each event descriptor carries a `name` identifying the event type.'
  - check: sep-9999-descriptor-description
    text: 'Each event descriptor carries a `description` of when the event fires.'
  - check: sep-9999-descriptor-delivery-subset
    text: '`delivery` lists the delivery modes this event type supports — any non-empty subset of `"poll"`, `"push"`, `"webhook"`. No mode is mandatory.'
  - check: sep-9999-descriptor-input-schema
    text: '`inputSchema` is a JSON Schema describing valid subscription arguments — these may include filters (which narrow the event stream), transforms (which modify payloads), or other server-defined configuration.'
  - check: sep-9999-descriptor-payload-schema
    text: '`payloadSchema` describes the shape of `data` in delivered events.'
  - check: sep-9999-descriptor-meta
    text: '`_meta` on an event descriptor is optional; same semantics as on Tool/Resource/Prompt.'
  - check: sep-9999-schema-evolution-additive
    text: "Servers SHOULD evolve an event type's `inputSchema` and `payloadSchema` additively for the lifetime of its `name`: new optional fields MAY be added; existing fields SHOULD NOT be removed, renamed, or retyped; enums SHOULD NOT be narrowed; and `inputSchema` SHOULD NOT be tightened such that previously accepted `arguments` become invalid."
  - check: sep-9999-breaking-change-new-name
    text: 'A breaking change SHOULD instead be published under a new event name, served alongside the old one for a migration period, after which the old name is removed.'

  # === Dynamic Event Types ===
  - check: sep-9999-list-changed-notification
    text: 'If the set of available event types, or the descriptor of any of them (`description`, `delivery`, `inputSchema`, `payloadSchema`), changes at runtime, the server sends a `notifications/events/list_changed` notification.'

  # === Event Type Removal and Breaking Changes (spec commit 28ec35e9) ===
  - check: sep-9999-removal-terminates-subscriptions
    text: "The server SHOULD end them using each mode's termination signal: `notifications/events/terminated` on push streams and a `terminated` envelope to webhook subscriptions."
  - check: sep-9999-removal-error-not-found
    text: 'The `error` is `-32011 NotFound` with `data: {"kind": "event"}` when the type was removed.'
  - check: sep-9999-removal-error-schema-changed
    text: 'The `error` is `-32014 Unsupported` with `data: {"feature": "payloadSchema" | "inputSchema", "reason": "schema_changed"}` when it was changed in place — not `-32012 Forbidden`, since the principal''s access is unchanged.'
  - check: sep-9999-removal-additive-no-terminate
    text: 'Purely additive changes MUST NOT terminate subscriptions.'
  - check: sep-9999-removal-poll-not-found
    text: 'Poll holds no server-side subscription to terminate: a poll against a removed name already returns `-32011 NotFound`.'

  # === Error Codes ===
  - check: sep-9999-error-invalid-params
    text: "`-32602 InvalidParams` — request is statically invalid: arguments don't match the event's inputSchema, the callback `delivery.url` is malformed or non-`https`, or `delivery.secret` is not a valid `whsec_` value."
  - check: sep-9999-error-not-found
    text: '`-32011 NotFound` — a referenced entity does not exist: an unknown event name, or no subscription matching the key on `events/unsubscribe`.'
  - check: sep-9999-error-forbidden
    text: '`-32012 Forbidden` — the authenticated principal is not permitted for this event/arguments combination, or its access was revoked.'
  - check: sep-9999-error-resource-exhausted
    text: '`-32013 ResourceExhausted` — a server-imposed limit or quota was reached. `data.limit` names it (e.g. `"subscriptions"`).'
  - check: sep-9999-error-unsupported
    text: '`-32014 Unsupported` — the request is well-formed but a requested capability or option is not supported here, e.g. a delivery mode the event type does not offer. `data` identifies it (e.g. `{"feature": "deliveryMode", "value": "push"}`).'
  - check: sep-9999-error-callback-endpoint-error
    text: '`-32015 CallbackEndpointError` — a client-supplied callback endpoint failed verification or could not be reached (webhook mode only). `data.reason` is one of the `lastError` categories.'
  - check: sep-9999-error-server-range
    text: 'These are general-purpose codes carried in the JSON-RPC implementation-defined server range `[-32000, -32099]`.'

  # === Poll-Based Delivery ===
  - check: sep-9999-poll-implemented
    text: 'Poll (`events/poll`) is request/response: client sends `{name, arguments, cursor}`, gets back `{events[], cursor, nextPollMs}`.'
  - check: sep-9999-poll-one-subscription-per-request
    text: 'Each `events/poll` request carries one subscription. A client with multiple subscriptions runs one poll loop per subscription.'
  - check: sep-9999-poll-bootstraps-subscription
    text: 'No separate subscribe step needed — the first poll with a null cursor bootstraps the subscription. Server holds no protocol-required state.'
  - check: sep-9999-poll-events-array
    text: 'The poll response carries an `events` array of `EventOccurrence` entries. Empty `events` array means nothing happened — this is the common case and should be cheap.'
  - check: sep-9999-poll-response-cursor
    text: 'The poll response carries `cursor` at the response level, the subscription position after this batch.'
  - check: sep-9999-poll-next-poll-ms
    text: '`nextPollMs` allows the server to dynamically adjust polling frequency (e.g., back off when rate-limited upstream, speed up when activity is detected).'
  - check: sep-9999-poll-next-poll-ms-ignored-when-has-more
    text: '`nextPollMs` is ignored when `hasMore` is `true`.'
  - check: sep-9999-poll-has-more
    text: '`hasMore` indicates whether additional events are available beyond the returned batch. When `true`, the client should poll again immediately with the updated cursor. When `false`, the client waits `nextPollMs` before the next poll.'
  - check: sep-9999-poll-max-events-cap
    text: '`maxEvents` is an optional cap on the number of events returned. If more events are available than the limit, the server returns a partial batch with an intermediate cursor and sets `hasMore: true`. If omitted, the server uses its own default limit.'
  - check: sep-9999-poll-stateless-request
    text: 'Each poll request is self-contained: the client provides the event name, arguments, and cursor. The server does not need to "remember" previous poll requests to answer them.'
  - check: sep-9999-poll-errors-are-jsonrpc
    text: 'Errors (`NotFound`, `Forbidden`, `InvalidParams`, `Unsupported`) are returned as a standard JSON-RPC error response for the request — there is no partial-success model since each request carries one subscription.'
  - check: sep-9999-poll-invalid-arguments
    text: "A poll whose `arguments` do not match the event's `inputSchema` returns `-32602 InvalidParams`."
  - check: sep-9999-poll-mode-unsupported
    text: 'A poll against an event type whose `delivery` does not list `"poll"` returns `-32014 Unsupported` identifying the unsupported delivery mode.'

  # === EventOccurrence schema ===
  - check: sep-9999-occurrence-event-id
    text: '`eventId` (string) is required on every `EventOccurrence`: a stable identifier for deduplication.'
  - check: sep-9999-occurrence-name
    text: '`name` (string) is required on every `EventOccurrence`: the event type name.'
  - check: sep-9999-occurrence-timestamp
    text: '`timestamp` (string, ISO 8601) is required on every `EventOccurrence`: when the event occurred.'
  - check: sep-9999-occurrence-data
    text: "`data` (object) is required on every `EventOccurrence`: payload conforming to the event type's `payloadSchema`."
  - check: sep-9999-occurrence-cursor-optional
    text: '`cursor` (string | null) is not required: subscription position after this event (push/webhook only; poll carries cursor at the response level).'
  - check: sep-9999-occurrence-meta-ungoverned
    text: '`_meta` is reserved for protocol/extension metadata, consistent with `_meta` on other MCP types. Not governed by `payloadSchema`.'
  - check: sep-9999-occurrence-event-id-from-upstream
    text: '`eventId` is server-assigned: when the upstream source provides a stable event identifier, the server SHOULD use that value as `eventId` so that the same upstream event surfaced via multiple paths carries the same `eventId` and dedup works.'

  # === Cursor Lifecycle ===
  - check: sep-9999-cursor-opaque
    text: 'Cursors are opaque strings managed by the server. They represent a position in the event stream. `cursor` is opaque to the client.'
  - check: sep-9999-cursor-null-starts-from-now
    text: 'Passing `cursor: null` in any mode means "start from now." The server returns a fresh cursor representing the current position (or `null` if the event type does not support replay). No historical events are replayed.'
  - check: sep-9999-cursor-absent-equals-null
    text: 'An absent `cursor` field MUST be treated identically to an explicit `cursor: null`: a sender MAY omit the field instead of writing `null`, and a receiver MUST NOT fail because it is missing.'
  - check: sep-9999-cursor-consistency
    text: 'Servers SHOULD be consistent: an event type that ever returns a non-null cursor SHOULD always do so, and one that returns `null` SHOULD always return `null`, so clients can branch once at subscribe time rather than per delivery.'
  - check: sep-9999-cursor-advances-when-quiet
    text: "The client's persisted cursor must advance during quiet periods. Poll covers this inherently (every response carries `cursor`, including when `events: []`)."
  - check: sep-9999-max-age-ms-floor
    text: 'All three modes accept an optional `maxAgeMs` (integer milliseconds) alongside `cursor`. When present, the server begins replay from whichever is later: the supplied `cursor`, or `now − maxAgeMs`.'
  - check: sep-9999-max-age-ms-sets-truncated
    text: 'If the floor advances past the cursor, the server SHOULD set `truncated: true` on the first response (poll result / `notifications/events/active` / webhook subscribe response) so the client knows older events were skipped.'
  - check: sep-9999-max-age-ms-ignored-when-cursor-null
    text: '`maxAgeMs` is ignored when `cursor` is `null` (null already means "now") and for event types that do not support replay.'
  - check: sep-9999-replay-ceiling-sets-truncated
    text: 'Servers MAY also apply their own replay ceiling independent of `maxAgeMs` and MUST signal it via `truncated: true` when they do.'
  - check: sep-9999-truncated-returns-fresh-cursor
    text: 'In all cases the server resets to a position it can serve from, returns that position as the fresh `cursor` alongside `truncated: true`, and continues — the client never reconnects or re-subscribes in response.'
  - check: sep-9999-truncated-poll-never-an-error
    text: 'For poll, `truncated` appears in the result body: `{events:[], cursor:<fresh>, truncated:true, hasMore, nextPollMs}`. Never a JSON-RPC error.'
  - check: sep-9999-truncated-false-when-no-replay
    text: 'For event types that do not support replay (`cursor` is always `null`), `truncated` SHOULD be `false`.'

  # === Push-Based Delivery ===
  - check: sep-9999-stream-implemented
    text: 'Push delivery uses a long-lived `events/stream` request — one per subscription. The request is a standard JSON-RPC request with an `id`, which enables cancellation via `notifications/cancelled` and is echoed in every notification for routing.'
  - check: sep-9999-stream-error-before-open
    text: 'If the subscription is invalid (`NotFound`, `Forbidden`, `InvalidParams`, `Unsupported`), the server responds immediately with a JSON-RPC error and no stream is opened.'
  - check: sep-9999-stream-active-confirmation
    text: 'Otherwise the server confirms the subscription with `notifications/events/active {cursor, truncated, _meta.subscriptionId}` and delivers events as notifications.'
  - check: sep-9999-stream-subscription-id-meta
    text: 'Every `notifications/events/*` message carries the JSON-RPC `id` of the parent `events/stream` request in `params._meta["io.modelcontextprotocol/subscriptionId"]` so a client with multiple concurrent streams can route notifications to the correct stream.'
  - check: sep-9999-stream-event-notification
    text: 'Events are delivered as `notifications/events/event` whose params are an `EventOccurrence`.'
  - check: sep-9999-stream-error-is-recoverable
    text: '`notifications/events/error` reports a recoverable failure (e.g., a single upstream fetch failed); the subscription remains active and the server retries and resumes.'
  - check: sep-9999-stream-terminated-ends-subscription
    text: 'Only `notifications/events/terminated` ends the subscription.'
  - check: sep-9999-stream-gap-resends-active
    text: "A gap (e.g., the cursor fell outside the upstream's retention window) is not an error — the server sends a fresh `notifications/events/active {cursor:<fresh>, truncated:true, _meta.subscriptionId}` and continues delivering."
  - check: sep-9999-stream-heartbeat-required
    text: 'The server MUST send periodic keepalive messages on the push stream so the client can distinguish "nothing to send" from "connection is dead."'
  - check: sep-9999-stream-heartbeat-carries-cursor
    text: "The heartbeat is `notifications/events/heartbeat` — `cursor` is the position the server has checked up to, so the client's persisted cursor advances even when no events match; it is `null` for event types that do not support replay."
  - check: sep-9999-stream-heartbeat-interval
    text: 'The server SHOULD send a heartbeat at least every 30 seconds.'
  - check: sep-9999-stream-heartbeat-not-sse-comment
    text: 'On Streamable HTTP this is sent as an SSE `data:` frame; the SSE comment form (`: keepalive`) is not used since it cannot carry cursor state.'
  - check: sep-9999-stream-final-result-shape
    text: 'The `StreamEventsResult` is an empty typed result (`{"_meta": {}}`). It carries no information — it satisfies JSON-RPC''s requirement that every request gets a response.'
  - check: sep-9999-stream-final-result-timing
    text: 'It is sent whenever the server can write a final frame: on Streamable HTTP only when the server initiates the close; on stdio the server MAY send it, and clients MUST NOT depend on receiving it.'
  - check: sep-9999-stream-cancel-stops-delivery
    text: 'In both cases, the server MUST stop delivering events and release any associated resources.'
  - check: sep-9999-stream-exempt-from-concurrency-cap
    text: 'Server SDKs MUST exempt `events/stream` from any general request-concurrency cap, since each push subscription is a long-lived request that never completes until cancelled.'
  - check: sep-9999-stream-carries-only-event-notifications
    text: "The `events/stream` response carries only `notifications/events/*` messages. This stream carries only this subscription's event notifications; it is not a general server-to-client channel."

  # === Webhook: subscribing ===
  - check: sep-9999-subscribe-webhook-only
    text: '`events/subscribe` is ONLY used for webhook delivery. Poll and push do not need it.'
  - check: sep-9999-subscribe-secret-required
    text: '`delivery.secret` is REQUIRED. The client supplies the HMAC signing secret; the server never generates one.'
  - check: sep-9999-subscribe-secret-format
    text: 'The value MUST be a Standard Webhooks symmetric secret: the literal prefix `whsec_` followed by base64 of 24–64 random bytes.'
  - check: sep-9999-subscribe-secret-rejected
    text: 'Servers MUST reject a `delivery.secret` that is not `whsec_` followed by base64 decoding to 24–64 bytes (per Standard Webhooks) with `InvalidParams`.'
  - check: sep-9999-subscribe-url-https-required
    text: 'Callback URLs MUST use `https://`.'
  - check: sep-9999-subscribe-url-non-https-rejected
    text: 'Servers MUST reject `events/subscribe` with a non-`https` `delivery.url` (`-32602 InvalidParams`).'
  - check: sep-9999-subscribe-auth-required
    text: '`events/subscribe` and `events/unsubscribe` MUST be called with an authenticated principal; servers MUST reject calls without an authorized principal with `-32012 Forbidden`.'
  - check: sep-9999-subscribe-key-composition
    text: "The subscription key is `(principal, delivery.url, name, arguments)`, where `principal` is the server's canonical identifier for the authenticated subject. `arguments` is compared by canonical-JSON equality. There is no client-generated `id`."
  - check: sep-9999-subscribe-key-immutable
    text: "All four components are immutable for the subscription's lifetime: a subscribe call with a different value for any of them addresses a different subscription."
  - check: sep-9999-subscribe-idempotent-upsert
    text: '`events/subscribe` is idempotent — calling it again with the same subscription key refreshes the TTL and updates mutable fields. If a subscription with the same scoped key exists, the server resets the TTL and updates mutable fields in place.'
  - check: sep-9999-subscribe-id-derived
    text: 'The server computes a deterministic `id` over the key (e.g., a truncated SHA-256 of the canonical key serialization) and returns it in the subscribe response. It is stable across refreshes and server restarts.'
  - check: sep-9999-subscribe-id-not-an-input
    text: "A caller who learns another tenant's derived `id` gains nothing — `id` is not accepted as input to any method."
  - check: sep-9999-subscribe-refresh-replaces-secret
    text: 'On an idempotent subscribe against an existing key, `delivery.secret` is replaced. To rotate, the client supplies a new value on refresh.'
  - check: sep-9999-subscribe-refresh-reactivates
    text: 'On an idempotent subscribe against an existing key, `active` is set to `true`. If delivery had been suspended due to repeated failures, the server resumes retrying pending events.'
  - check: sep-9999-subscribe-response-cursor
    text: "The subscribe response carries `cursor`, a safe-to-persist watermark that advances the client's cursor even if no events arrive before next refresh."
  - check: sep-9999-subscribe-response-truncated
    text: 'The subscribe response carries `truncated`, true if delivery started later than the supplied cursor (retention window, `maxAgeMs` floor, or server-side ceiling).'
  - check: sep-9999-subscribe-cross-tenant-isolation
    text: 'Because the key includes `principal` and `delivery.url`, two distinct tenants subscribing to the same `(name, arguments)` get distinct subscriptions.'

  # === Webhook: TTL negotiation ===
  - check: sep-9999-ttl-refresh-before-lte-suggestion
    text: '`refreshBefore` (response) is the grant. It SHOULD be less than or equal to the suggestion.'
  - check: sep-9999-ttl-no-rejection-path
    text: 'Clamping in either direction is self-announcing — the client reads the granted `refreshBefore` and schedules its refresh loop from that, so a clamped grant is not an error and there is no rejection path for TTL values.'
  - check: sep-9999-ttl-null-only-when-requested
    text: 'A server MUST NOT return `null` unless the client suggested `ttlMs: null` — no expiry exceeds every finite suggestion.'
  - check: sep-9999-ttl-omitted-means-default
    text: 'Omitting `ttlMs` means "server default." An explicit `ttlMs: null` requests a subscription with no expiry.'
  - check: sep-9999-ttl-long-grant-retained
    text: 'A server granting long or no-expiry TTLs MUST retain subscriptions for the lifetime it granted, including across restarts.'
  - check: sep-9999-ttl-no-expiry-persisted
    text: 'The server MUST persist no-expiry subscriptions across restarts, because a client that never refreshes will never detect (or repair) a silently dropped one.'
  - check: sep-9999-ttl-no-expiry-gc-terminated
    text: 'The server MAY drop a no-expiry subscription after sustained delivery failure (server-defined window), and SHOULD attempt a `terminated` envelope when it does.'

  # === Webhook: unsubscribing ===
  - check: sep-9999-unsubscribe-by-key
    text: '`events/unsubscribe` is eager cleanup; the server looks the subscription up by the same compound key used for idempotent upsert on subscribe.'
  - check: sep-9999-unsubscribe-unknown-not-found
    text: 'No subscription matching the key on `events/unsubscribe` returns `-32011 NotFound`.'

  # === Webhook: delivery status ===
  - check: sep-9999-delivery-status-last-error-category
    text: '`lastError` MUST be a server-generated category string — one of `connection_refused`, `timeout`, `tls_error`, `http_4xx`, `http_5xx`, `challenge_failed` — and MUST NOT include raw response bodies.'

  # === Webhook: delivery mechanics ===
  - check: sep-9999-delivery-post-json
    text: 'Deliveries are HTTP `POST` only, with Content-Type `application/json`.'
  - check: sep-9999-delivery-standard-webhooks-headers
    text: 'Every delivery MUST include `webhook-id` (the `eventId` for event deliveries; `msg_<type>_<random>` for control envelopes), `webhook-timestamp` (Unix seconds), and `webhook-signature`.'
  - check: sep-9999-delivery-subscription-id-header
    text: 'In addition to the Standard Webhooks headers, deliveries MUST include `X-MCP-Subscription-Id` (the subscription `id`) so the receiver can select the correct secret without parsing the body. This is the only MCP-specific header.'
  - check: sep-9999-delivery-signature-formula
    text: 'The signature is `HMAC-SHA256(secret, webhook-id + "." + webhook-timestamp + "." + body)` encoded as base64 with a `v1,` prefix, where `body` is the raw HTTP request body bytes exactly as received and `secret` is the base64-decoded bytes of the value after the `whsec_` prefix.'
  - check: sep-9999-delivery-retry-regenerates-signature
    text: "Each retry attempt MUST regenerate the timestamp and signature so retries are not rejected by the receiver's freshness window."
  - check: sep-9999-delivery-dual-sign-on-rotation
    text: 'The server SHOULD dual-sign deliveries with both the old and new secrets for a short grace window so in-flight deliveries verify under either.'
  - check: sep-9999-delivery-body-size
    text: 'Servers SHOULD keep delivery bodies at or under 256 KiB, consistent with Payload Minimality.'
  - check: sep-9999-delivery-413-non-retryable
    text: 'Receivers and intermediaries MAY reject larger bodies with `413 Payload Too Large`; servers MUST treat `413` as a non-retryable failure for that event.'
  - check: sep-9999-delivery-410-non-retryable
    text: 'A receiver that intentionally rejects a delivery and does not want it retried responds `410 Gone`; the server MUST treat it as non-retryable.'
  - check: sep-9999-delivery-retries-bounded
    text: 'Retries are bounded: servers SHOULD cap both the attempt count and the elapsed retry window (for example, 3–5 attempts spread over no more than 10–15 minutes).'

  # === Webhook: SSRF and endpoint verification ===
  - check: sep-9999-ssrf-validate-callback-url
    text: 'The server MUST validate callback URLs.'
  - check: sep-9999-ssrf-reject-non-routable
    text: 'Servers SHOULD reject URLs whose resolved IP is not globally routable per the IANA IPv4 and IPv6 Special-Purpose Address Registries unless explicitly configured to allow them.'
  - check: sep-9999-ssrf-validate-at-delivery-time
    text: 'To prevent DNS rebinding, this validation MUST be performed at delivery time, not only at subscribe time: the server resolves the hostname, checks the resolved IP against the blocklist, and connects directly to that validated IP.'
  - check: sep-9999-ssrf-no-redirects
    text: 'Webhook delivery requests MUST NOT follow HTTP redirects, since a redirect can target an internal address that bypasses the blocklist.'
  - check: sep-9999-verification-required-before-delivery
    text: "A server MUST NOT begin delivering to a callback URL until the endpoint's intent to receive deliveries is confirmed, by one of: a verification handshake, a server-configured allowlist, prior out-of-band verification, or a receiver-published well-known document."
  - check: sep-9999-verification-challenge-echo
    text: 'Before activating, the server POSTs a `verification` control envelope carrying a single-use, short-lived `challenge` nonce (signed and headed like any delivery), and the endpoint proves intent by echoing the nonce in a `2xx` body (`{"challenge":"<nonce>"}`), which the server compares in constant time.'
  - check: sep-9999-verification-failure-error
    text: 'A reachable endpoint that fails to echo yields `-32015 CallbackEndpointError` with `data.reason: "challenge_failed"`; an unreachable one yields the same code with the relevant connection-failure category.'
  - check: sep-9999-verification-cached-per-principal-url
    text: "Verification is cached per `(principal, url)`: a successful handshake, allowlist hit, or well-known match covers that principal's subscriptions to that URL across refreshes and `arguments`, so varying `arguments` cannot multiply verification POSTs at a victim and one principal's verification never waives the challenge for another."
  - check: sep-9999-verification-persisted-for-no-expiry
    text: 'A server that persists no-expiry subscriptions across restarts MUST persist their verification status alongside them.'
  - check: sep-9999-verification-uses-ssrf-hardened-path
    text: 'The verification POST MUST use the same SSRF-hardened path as deliveries (delivery-time IP validation, no redirects).'
  - check: sep-9999-verification-no-raw-endpoint-responses
    text: 'Failures surface only via the `lastError` category `challenge_failed`, never raw endpoint responses.'
  - check: sep-9999-server-identity-key-discovery
    text: 'The verifying public key MUST be discovered from an origin the client already authenticates, and never from the challenge or delivery body, which the attacker controls.'

  # === Webhook: control envelopes ===
  - check: sep-9999-envelope-type-discriminator
    text: 'A body with a top-level `type` field is a control envelope; a body without one is an `EventOccurrence`.'
  - check: sep-9999-envelope-signed-like-deliveries
    text: 'Control envelopes are signed and headed exactly like event deliveries (Standard Webhooks headers + `X-MCP-Subscription-Id`); the body carries a `type` discriminator instead of `eventId`/`data`.'
  - check: sep-9999-envelope-webhook-id-format
    text: '`webhook-id` for control envelopes is a per-message identifier of the form `msg_<type>_<random>` so receivers can dedup retries.'
  - check: sep-9999-envelope-gap
    text: 'A `gap` envelope `{"type":"gap","cursor":"<fresh>"}` is sent when a gap is detected between refreshes. The client persists `cursor` and treats it as `truncated: true`.'
  - check: sep-9999-envelope-terminated
    text: 'A `terminated` envelope `{"type":"terminated","error":{...}}` is sent when the subscription has ended (e.g., authorization revoked). The subscription no longer exists server-side.'

  # === Authorization ===
  - check: sep-9999-authz-subscribe-time
    text: 'When the caller is authenticated, the server MUST verify the principal has permission to subscribe to the requested event type with the given arguments.'
  - check: sep-9999-authz-delivery-time-reverify
    text: 'The server SHOULD periodically re-verify permissions.'

  # === Payload handling (server side) ===
  - check: sep-9999-payload-minimality
    text: 'Servers SHOULD keep event payloads minimal — enough to identify and triage the event, not the full content.'

  # ==========================================================================
  # Excluded rows. Each carries an RFC 2119 keyword in the source but is not a
  # server wire obligation, so no server-side scenario can emit a check for it.
  # Kept here so the keyword sweep stays auditable against the document.
  # ==========================================================================

  # --- Client / host obligations ---
  - text: 'The client SHOULD re-call `events/list` to refresh its event type registry.'
    excluded: client-side obligation; needs a client-conformance scenario set
  - text: 'The client SHOULD poll again immediately (ignoring `nextPollMs`) to drain the backlog.'
    excluded: client-side obligation; needs a client-conformance scenario set
  - text: 'Clients SHOULD apply a configurable floor (default 1000 ms) to guard against a misbehaving server inducing a tight loop.'
    excluded: client-side obligation; needs a client-conformance scenario set
  - text: 'Clients SHOULD NOT apply their default request timeout to `events/stream`; a client that has received neither an event nor a heartbeat for more than twice the heartbeat interval SHOULD treat the stream as dead and reconnect with its cursor.'
    excluded: client-side obligation; needs a client-conformance scenario set
  - text: 'Unless granted no expiry, the client MUST re-call `events/subscribe` with the same subscription key before `refreshBefore` to keep the subscription alive.'
    excluded: client-side obligation; needs a client-conformance scenario set
  - text: 'Even with no expiry, clients SHOULD still re-call `events/subscribe` (and `events/list`) occasionally.'
    excluded: client-side obligation; needs a client-conformance scenario set
  - text: 'A client receiving `cursor: null` MUST NOT attempt to persist or replay from it; on reconnect/resubscribe it sends `cursor: null` (start from now).'
    excluded: client-side obligation; needs a client-conformance scenario set
  - text: '`truncated: true` always implies a possible gap; clients SHOULD treat it as such and persist the fresh cursor.'
    excluded: client-side obligation; needs a client-conformance scenario set
  - text: "Client SDKs SHOULD generate the secret on the application's behalf rather than expose an interface that encourages hand-picked values, from a CSPRNG by default."
    excluded: client-SDK guidance; not observable from the server under test
  - text: 'Event payloads MUST be treated with the same caution as tool results. Clients SHOULD sanitize or sandbox event payloads before presenting them to an LLM.'
    excluded: host obligation; not observable from the server under test
  - text: 'Clients SHOULD support policy evaluation between event receipt and action execution, and SHOULD respect server-declared governance metadata.'
    excluded: host obligation (Enterprise Governance); not observable from the server under test
  - text: 'The client SDK SHOULD remove the subscription and notify the application when a termination signal arrives.'
    excluded: client-SDK guidance; not observable from the server under test

  # --- Receiver (callback endpoint) obligations ---
  - text: 'The receiver MUST verify the signature before processing, SHOULD reject deliveries where `webhook-timestamp` is more than 5 minutes old, and SHOULD deduplicate on `webhook-id`.'
    excluded: receiver obligation; the harness implements this rather than grading it
  - text: 'Receivers MUST compute the HMAC over the raw body, never over a re-serialized JSON object.'
    excluded: receiver obligation; the harness implements this rather than grading it
  - text: 'The endpoint MUST make `cursor` and `eventId` available to the consuming client, and MUST forward control envelopes by the same channel it forwards events.'
    excluded: receiver obligation; the harness implements this rather than grading it
  - text: 'The endpoint SHOULD NOT return `2xx` until the event has been durably persisted or forwarded, and SHOULD respond quickly.'
    excluded: receiver obligation; the harness implements this rather than grading it
  - text: 'A receiver that gets a delivery for an `id` it has not yet been told to route SHOULD return a retryable status (`503` or `425 Too Early`).'
    excluded: receiver obligation; the harness implements this rather than grading it

  # --- Server-SDK implementation guidance (not wire-observable) ---
  - text: "The SDK SHOULD enable poll by default so it's available unless the author opts out."
    excluded: server-SDK guidance; indistinguishable on the wire from an author opting in
  - text: 'SDKs SHOULD refuse a no-expiry cap unless the author has wired up durable storage.'
    excluded: server-SDK guidance; a construction-time policy with no wire signal
  - text: 'SDKs SHOULD provide an in-memory ring buffer that retains a bounded window of emitted events per event type.'
    excluded: server-SDK guidance; an internal structure with no wire signal
  - text: 'Servers SHOULD enforce the subscription limit (`ResourceExhausted`) before invoking `on_subscribe`, so a rejected subscription never provisions upstream resources.'
    excluded: server-SDK ordering guidance; the harness cannot observe hook invocation order
  - text: "The lease window is SDK-configurable and SHOULD default to a small multiple of the server's typical `nextPollMs`. Server authors SHOULD write `on_subscribe` to be idempotent."
    excluded: server-SDK guidance; an internal lease table with no wire signal
  - text: 'Authors SHOULD prefer a `check()` function that queries the upstream over emit-only for upstreams offering a durable cursor.'
    excluded: server-authoring guidance; a design recommendation with no wire signal
  - text: 'On HTTP/1.1 each stream is a TCP connection, so SDKs SHOULD prefer HTTP/2 when many subscriptions are active.'
    excluded: transport guidance; not a protocol conformance obligation

  # --- Deployment profile advisories ---
  - text: 'A WAF MAY drop requests missing any required header as a cheap pre-filter; WAF rules SHOULD NOT rely on UA matching as a security control. Servers SHOULD document their egress ranges out-of-band.'
    excluded: deployment advisory addressed to operators, not to an implementation

  # --- Pure MAY / OPTIONAL (handoff disposition: no row) ---
  - text: 'A server MAY return `cursor: null` in any delivery (poll result, push `notifications/events/event` and `notifications/events/active`, webhook payload) when the event type does not support replay.'
    excluded: pure MAY; kept as context for sep-9999-cursor-consistency, which carries the testable half
  - text: 'The one sanctioned exception is a server-side floor: a server MAY clamp an impractically short suggestion up to its minimum TTL to protect itself from refresh storms.'
    excluded: pure MAY; the testable half is sep-9999-ttl-refresh-before-lte-suggestion, which this sentence excepts
  - text: 'The header MAY contain multiple space-delimited signatures (`v1,<sigA> v1,<sigB>`) during secret rotation; the receiver accepts if any verifies.'
    excluded: pure MAY, and the obligation it creates falls on the receiver
  - text: 'After repeated failures (server-defined threshold), the server MAY suspend delivery (`deliveryStatus.active: false`).'
    excluded: pure MAY; suspension is observable only through the OPTIONAL deliveryStatus object
  - text: '`deliveryStatus` is OPTIONAL — servers MAY omit it entirely. The `events/subscribe` response MAY include a `deliveryStatus` object when refreshing an existing subscription.'
    excluded: OPTIONAL by its own wording; a server omitting deliveryStatus entirely is conformant
