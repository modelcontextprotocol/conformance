# spec_source: modelcontextprotocol/modelcontextprotocol@c47fd2451c91ad11708dd498ddee060a1d73aedc seps/0000-events-extension.md
# extracted: 2026-09-15 against the design sketch; every row re-quoted against SEP-3415 at c47fd245 on 2026-10-14
#
# ############################################################################
# # MCP Events is SEP-3415 (modelcontextprotocol/modelcontextprotocol#3415).  #
# # Every row quotes the SEP at c47fd245 and carries a `url` to its section.  #
# ############################################################################
#
#   SEP numbers are PR numbers in modelcontextprotocol/modelcontextprotocol.
#   Peter Alexander opened PR 3415 on 2026-10-05, writing the design sketch up
#   in SEP format, so this file and every check ID took that number in place of
#   the 9999 placeholder they carried while no PR existed. The file keeps its
#   `0000-events-extension.md` name upstream until the SEP is accepted, but the
#   number does not change.
#
#   The rows were first written against the design sketch, and the SEP restates
#   the sketch rather than quoting it: only 11 of 165 row texts survived
#   verbatim, even where the rule was unchanged. So every row was re-quoted
#   (panyam/mcpkit#1502). A row's `text` is an exact span of the SEP, and its
#   `url` is the section that span sits under, both checked mechanically
#   against the pinned file. Three conventions came out of that:
#
#   - A row backed by a table quotes the table row as its cells, the last one
#     after a colon (e.g. "`NotFound` `-32023`: A referenced entity ..."). The
#     SEP gives the error-code numbers only in its Error Handling table, so the
#     code rows all read this way.
#   - Two rules the SEP states only inside its JSON examples
#     (sep-3415-list-pagination, sep-3415-descriptor-meta) quote the example's
#     comment, and two (sep-3415-list-implemented, sep-3415-descriptor-name)
#     quote the Abstract, which is the only place the SEP says them in prose.
#   - Seven excluded rows quote Appendix A, the SEP's SDK guidance, which is
#     non-normative. They stay listed for traceability and could not back a
#     graded row.
#
#   What the re-extraction changed besides wording:
#
#   - sep-3415-descriptor-description is gone. The SEP never states that a
#     descriptor carries a `description`; the field appears only in the JSON
#     example and in the list of fields whose change triggers `list_changed`.
#   - Two rows are new: sep-3415-subscribe-refresh-before-present
#     ("`refreshBefore` (response, always present, nullable)") and
#     sep-3415-unsubscribe-empty-result ("The result is an empty `Result`").
#   - Five graded rows now quote a rule the SEP states differently from the
#     sketch, and their checks have not caught up (panyam/mcpkit#1502):
#     sep-3415-capability-client-declaration (declared per request in `_meta`
#     on the 2026-07-28 wire), sep-3415-capability-list-changed-gated and
#     sep-3415-list-changed-notification (delivered on `subscriptions/listen`
#     to clients that opted in), sep-3415-delivery-410-non-retryable (the
#     subscription itself MUST survive a 410) and
#     sep-3415-delivery-status-last-error-category (the MUST NOT now covers raw
#     headers and status lines too). The first emits no check today. The two
#     list_changed rows are graded over `subscriptions/listen` in
#     events-discovery since panyam/mcpkit#1505.
#
#   The six capability rows quote SEP-3415's Capability Negotiation section,
#   which put the declaration in Extension Negotiation. The sketch's `main`
#   still says top-level `capabilities.events`; its PR 7, which would have
#   moved it, closed unmerged on 2026-09-28.
#
# provenance: first extracted against the merged design sketch on `main`, which
#   landed 2026-09-08. Two spec commits land inside that extraction:
#   `197c32b4` (2026-05-10) renamed the duration fields to `nextPollMs` and
#   `maxAgeMs`, and `28ec35e9` (2026-09-04) added event-type removal and
#   breaking-change termination. The SEP carries both.
#
#   The SEP is a single markdown file under `seps/`, not a
#   `docs/specification/draft/*.mdx` diff, so `new-sep`'s `--spec-path`
#   (src/new-sep/index.ts:19 hard-requires that prefix) still cannot point at
#   it. `spec_url` and the per-row urls are pinned to the commit instead, so
#   they keep resolving when the PR moves. Re-extract when the SEP's head
#   moves past c47fd245.
#
# coverage: 147 declared checks plus 26 excluded rows.
#
#   136 server rows (see the server branch's header: the 2026-10-14
#   re-extraction dropped one and added two, and on 2026-10-15 one more was
#   added and two moved to excluded), plus 11 client rows: ten added with
#   the client scenarios in modelcontextprotocol/conformance#540, and
#   sep-3415-client-listen-opt-in with mcpkit #1505. Seven of the ten were
#   excluded here as client obligations before a client scenario set existed. The other
#   three the first sweep missed: the client half of the Fallback sentence
#   (no `events/*` to a server that did not advertise the extension), "Clients
#   SHOULD respect" `nextPollMs` under Enterprise Governance, and the receiver
#   half of "Absent means null", which binds a client reading a poll response
#   as much as a server reading a request.
#
#   A keyword sweep of SEP-3415 at c47fd245, outside code blocks and before the
#   non-normative Appendix A, finds 135 RFC 2119 keyword occurrences: 33 MUST,
#   10 MUST NOT, 3 REQUIRED, 46 SHOULD, 9 SHOULD NOT (101 normative), plus 33
#   MAY and 1 OPTIONAL. The design sketch these rows were first extracted from
#   had 144 (109 normative); the SEP states fewer rules with keywords and more
#   as tables and examples.
#
#   Only 56 of the declared rows quote a sentence carrying a keyword. The other
#   91 are shape requirements the document states declaratively — the
#   `EventOccurrence` field table, the error-code table, the `events/list`
#   descriptor fields, the response payloads. They are normative and directly
#   testable, they are simply not written with a keyword, which is why the row
#   count exceeds the sentence count in the sweep. One keyword sentence also
#   frequently carries several distinct obligations (the Standard Webhooks
#   signature sentence, the subscription-key sentence), which pushes the same
#   way.
#
#   severity rule, since the usual "follow the keyword" mapping is undefined
#   for a shape row: MUST / MUST NOT / REQUIRED -> FAILURE, SHOULD /
#   SHOULD NOT -> WARNING. For a shape row, a field the document
#   marks Required in a schema table, or a wire fact a client cannot work
#   without (an error code, a method existing at all), is FAILURE; everything
#   else drawn from an example payload is WARNING.
#
#   Pure MAY and OPTIONAL sentences get no row at all, per the handoff
#   disposition table. The five that initially got one are demoted to
#   `excluded:` at the foot of this file rather than deleted, so the sweep
#   stays auditable against the document.
#
# excluded rather than declared: client-SDK and host obligations no wire
#   shows (secret generation, payload sanitization, policy evaluation),
#   receiver obligations the harness implements rather than grades, server-SDK
#   implementation guidance from the two "SDK Guidance" sections, and the
#   WAF/deployment profile advisories. Declaring them would inflate the
#   denominator with rows no scenario, server or client, could ever emit.
#
# deliberately not declared here: pagination semantics for `events/list`. The
#   sketch defers them ("same semantics as tools/list etc."), so the obligation
#   is the base protocol's and belongs to the core pagination scenarios.
#   `sep-3415-list-pagination` declares only the part this document adds, which
#   is that `events/list` participates in that scheme at all.
#
#   An `events/poll` against an unknown name is stated twice, once under Error
#   Codes and once as the poll consequence of an event type having been
#   removed. Only `sep-3415-removal-poll-not-found` is declared for it; a
#   second row would double-count one probe.
#
#   `## Key Design Decisions`, `## Open Questions` and `## What Is NOT in v1`
#   are rationale rather than requirements and produce no rows. The design
#   table restates the webhook secret, TTL and TLS rules already declared above
#   it.
#
